<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ピンポン野球 速報</title>
<style>
  body{margin:0;background:#0d0d10;color:#9fa3ad;font-family:sans-serif;
       display:flex;align-items:center;justify-content:center;min-height:100vh}
</style>
</head>
<body>
読み込み中…
<script>
// ピンポン野球速報サイトのラッパーページ。
// GASのWebアプリからページ内容をCookie無しで取得して表示する
// （script.google.com を直接開くと起きるGoogleの多重ログイン問題を回避できる）。
// デプロイを作り直してURLが変わったときは、下のGAS_URLを新しい /exec に差し替えること。
var GAS_URL = "https://script.google.com/macros/s/AKfycbzGOx89-rBxlZaPo2S1UDKbURy_4X9ZLGf-stYZ4Wh1G6sw07OudAfKUoGC6kAC1fGQKg/exec";

// 記録ページはGAS直接アクセスが必要（fetch経由では動かない）
if (location.search.indexOf("view=record") !== -1) {
  location.href = GAS_URL + location.search;
}

// GASの応答は温まっていても1.5秒ほどかかる。前回見た内容を端末に残しておき、
// まず即座に表示してから裏で最新を取り直す（内容が変わったときだけ差し替える）。
var CACHE_PREFIX = "pp:";
var CACHE_MAX_AGE = 6 * 60 * 60 * 1000; // 6時間（サーバー側のキャッシュと同じ）
var LIVE_PARAM = "sheet=LIVE";

function urlFor(search) {
  return GAS_URL + (search ? search + "&raw=1" : "?raw=1");
}
function cacheKey(search) { return CACHE_PREFIX + (search || ""); }

// GASが書き出しておいた完成HTMLが data/p/ にあればCDNから読む（数十ミリ秒）。
// 無ければ今までどおりGASから取る（1〜6秒）。どのページを書き出したかは
// ラッパー側では持たず、ファイルが無ければ404で自然にGASへ回る。
// クエリの並び順が違っても同じページとみなせるよう、並べ替えてから名前にする
// （GAS側の canonQuery_ / queryKey_ と同じ規則）。
function staticFor(search) {
  if (!search) return "data/p/" + queryKey("");
  if (search.indexOf(LIVE_PARAM) !== -1) return null;   // 速報は常に最新を取る
  return "data/p/" + queryKey(search);
}
function queryKey(search) {
  // 符号化の違い（フォーム送信は空白を + に、GAS側は %20 にする等）を吸収するため、
  // いったん復号してから同じ方式で符号化し直す
  function dec(x) {
    try { return decodeURIComponent(String(x).replace(/\+/g, "%20")); } catch (e) { return String(x); }
  }
  var parts = String(search || "").replace(/^\?/, "").split("&")
    .filter(function (p) { return p && p.indexOf("raw=") !== 0; })
    .map(function (p) {
      var i = p.indexOf("=");
      var k = i < 0 ? p : p.slice(0, i);
      var v = i < 0 ? "" : p.slice(i + 1);
      return encodeURIComponent(dec(k)) + "=" + encodeURIComponent(dec(v));
    });
  parts.sort();
  var s = parts.join("&");
  var h = 5381;
  for (var i2 = 0; i2 < s.length; i2++) h = (((h * 33) ^ s.charCodeAt(i2)) >>> 0);
  return s.length.toString(36) + "_" + h.toString(36) + ".html";
}

// 取得元を順に試す。最初に成功したHTMLを返す
function fetchPage(search) {
  var sp = staticFor(search);
  var gas = function () {
    return fetch(urlFor(search)).then(function (r) { return r.text(); })
      .then(function (t) {
        if (!t || t.indexOf("<") !== 0) throw new Error("bad response");
        return t;
      });
  };
  if (!sp) return gas();
  // 1分ごとに変わる値を付けて、CDNに古い内容が残り続けないようにする
  return fetch(sp + "?v=" + Math.floor(Date.now() / 60000))
    .then(function (r) {
      if (!r.ok) throw new Error("no static");
      return r.text();
    })
    .then(function (t) {
      if (!t || t.indexOf("<") !== 0) throw new Error("bad static");
      return t;
    })
    .catch(gas);   // 書き出していないページ・書き出し前の試合はGASへ
}

function readCache(search) {
  try {
    var raw = localStorage.getItem(cacheKey(search));
    if (!raw) return null;
    var o = JSON.parse(raw);
    if (!o || !o.t || !o.html) return null;
    if (Date.now() - o.t > CACHE_MAX_AGE) return null;
    return o.html;
  } catch (e) { return null; }
}
function writeCache(search, html) {
  try {
    localStorage.setItem(cacheKey(search), JSON.stringify({ t: Date.now(), html: html }));
  } catch (e) {
    // 容量オーバー時は古いものを捨ててから諦める
    try {
      for (var i = localStorage.length - 1; i >= 0; i--) {
        var k = localStorage.key(i);
        if (k && k.indexOf(CACHE_PREFIX) === 0) localStorage.removeItem(k);
      }
    } catch (e2) {}
  }
}

function show(html) {
  // document.open() は「解析中のインラインスクリプトから呼ばれたら何もしない」仕様。
  // そのまま document.write すると元のbody（「読み込み中…」とflexのCSS）が残り、
  // 中身が横に並んでしまうので、解析が終わってから差し替える。
  if (document.readyState === "loading") {
    setTimeout(function () { show(html); }, 0);
    return;
  }
  document.open();
  document.write(html);
  document.close();
}

// 表示中のページから辿れるリンクを先に取ってきて、次の1クリックを速くする
function prefetchLinks(html) {
  try {
    var re = /href="\?([^"]*)"/g, m, seen = {}, list = [];
    while ((m = re.exec(html)) && list.length < 4) {
      var s = "?" + m[1].replace(/&amp;/g, "&");
      if (seen[s] || s.indexOf(LIVE_PARAM) !== -1) continue;
      seen[s] = 1;
      if (!readCache(s)) list.push(s);
    }
    list.forEach(function (s) {
      fetchPage(s).then(function (t) { if (t && t.indexOf("<") === 0) writeCache(s, t); })
        .catch(function () {});
    });
  } catch (e) {}
}

var search = location.search;
var isLive = search.indexOf(LIVE_PARAM) !== -1; // 試合中の速報は常に最新を取る
var cachedHtml = isLive ? null : readCache(search);
var shown = false;

if (cachedHtml) {
  show(cachedHtml);          // まず即表示（体感はほぼ0秒）
  shown = true;
}

fetchPage(search)
  .then(function (t) {
    if (!isLive) writeCache(search, t);
    // 先に出した内容と同じなら書き換えない（ちらつき防止）
    if (!shown) { show(t); shown = true; }
    else if (t !== cachedHtml) { show(t); }
    prefetchLinks(t);
  })
  .catch(function () {
    if (!shown) {
      document.body.textContent = "読み込みに失敗しました。通信環境を確認して再読み込みしてください。";
    }
  });
</script>
</body>
</html>
